name: Deploy to Cloud Run

on:
  # Temporary static hosting: Cloud Run releases are explicit recovery actions.
  workflow_dispatch:

concurrency:
  group: explorer-production-release
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node --import tsx --test scripts/deploy.test.mjs
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/288836337031/locations/global/workloadIdentityPools/github-actions-pool/providers/github-provider
          service_account: explorer-build-sa@chm-network.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: chm-network
      - run: ./scripts/deploy.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-${{ github.sha }}
          path: .release/*/state.json
          include-hidden-files: true
          if-no-files-found: ignore
